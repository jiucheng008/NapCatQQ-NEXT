name: Publish public release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag'
        required: true
        default: v4.18.42
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download archived assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          BASE="https://github.com/lingyezhixing/NapCatQQ/releases/download/${VERSION}"
          curl -fL --retry 5 -o NapCat.Shell.zip "${BASE}/NapCat.Shell.zip"
          curl -fL --retry 5 -o NapCat.Framework.zip "${BASE}/NapCat.Framework.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: NapCat ${{ inputs.version }}
          body: |
            Public release assets for the maintained private fork.
            Source and updates: https://github.com/jiucheng008/NapCatQQ-NEXT-private
          files: |
            NapCat.Shell.zip
            NapCat.Framework.zip
          draft: false
          prerelease: false