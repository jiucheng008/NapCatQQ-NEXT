name: Fork Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-fork.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Mirror latest NapCat Docker
        env:
          SRC: mlikiowa/napcat-docker:v4.18.42
          DST: ghcr.io/jiucheng008/napcat-docker
        run: |
          docker pull "$SRC"
          docker tag "$SRC" "$DST:4.18.42"
          docker tag "$SRC" "$DST:latest"
          docker push "$DST:4.18.42"
          docker push "$DST:latest"